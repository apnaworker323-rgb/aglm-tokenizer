[package]
name = "aglm_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "_aglm_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
fancy-regex = "=0.18.0"
regex = "=1.13.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1
